<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b20"><title>NEON ESCAPE ∞ 3D</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b1d;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;touch-action:none}#hud{position:fixed;top:max(15px,env(safe-area-inset-top));left:14px;right:14px;display:none;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;font-weight:850;text-shadow:0 2px 10px #000}#hud span{background:#09152bbd;border:1px solid #56dbff65;padding:9px;border-radius:12px}#pause{pointer-events:auto}button{border:1px solid #75e6ff80;border-radius:14px;background:linear-gradient(130deg,#00a6b5,#5244e5);color:#fff;padding:12px 18px;font-weight:850;font-size:17px}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#25366ddc,#040917f5);padding:22px;text-align:center}#card{max-width:410px;border:1px solid #71e9ff55;border-radius:28px;padding:30px 20px;background:#0b1631e9;box-shadow:0 0 80px #13bfff22}h1{font-size:clamp(36px,11vw,55px);line-height:1;letter-spacing:1px;color:#c2faff;text-shadow:0 0 25px #16ddff;margin:10px 0 18px}p{color:#c1d3ed;line-height:1.6}small{color:#9fb6ce}#play{font-size:21px;padding:17px 58px;margin:12px}#joy{position:fixed;width:104px;height:104px;border-radius:50%;border:2px solid #affbff66;background:#69dbff17;pointer-events:none;display:none;transform:translate(-50%,-50%);box-shadow:inset 0 0 20px #79edff16}#nub{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:#94f7ff77;border:1px solid #d5ffffb0;transform:translate(-50%,-50%)}</style></head>
<body><div id="hud"><span id="hp">♥ ♥ ♥</span><span id="stats">◆ 0 · 0s</span><button id="pause">Ⅱ</button></div><div id="joy"><div id="nub"></div></div><div id="overlay"><div id="card"><small>3D ARENA · VISUAL UPDATE</small><h1>NEON<br>ESCAPE ∞</h1><p id="description">3D arenada kristalleri topla, robotlardan kaç ve 90 saniye hayatta kal. Yeşil enerji küresi kısa süreli güç verir.</p><button id="play">OYNA</button><p><small>İstediğin yere dokun: saydam joystick orada açılır. Karakter dokunduğun yere ışınlanmaz.</small></p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x14244a);scene.fog=new THREE.FogExp2(0x14244a,.012);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,150),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=2.0;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc1efff,0x40539a,3.5));let light=new THREE.DirectionalLight(0xffffff,4.0);light.position.set(-7,16,8);scene.add(light);
const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.4,metalness:.4,emissive:c,emissiveIntensity:e});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({color:0x354c78,roughness:.75,metalness:.12}));floor.rotation.x=-Math.PI/2;floor.position.y=-.07;scene.add(floor);
const grid=new THREE.GridHelper(90,30,0x5d95bc,0x4b7099);grid.position.y=-.05;grid.material.transparent=true;grid.material.opacity=.15;scene.add(grid);
const edgeMat=mat(0x3be9ff,1.2),metal=mat(0x324975,.1),pink=mat(0xff62b2,.8),gold=mat(0xffd26d,.8);
for(let i=0;i<24;i++){let a=i/24*Math.PI*2,r=23+Math.sin(i*13)*2.5;let ob=new THREE.Group(),h=2.8+i%4*.75;let pillar=new THREE.Mesh(new THREE.CylinderGeometry(.65,1.05,h,6),metal);pillar.position.y=h/2;ob.add(pillar);let cap=new THREE.Mesh(new THREE.CylinderGeometry(.76,.76,.2,6),i%3===0?pink:edgeMat);cap.position.y=h+.08;ob.add(cap);let ring=new THREE.Mesh(new THREE.TorusGeometry(.88,.075,5,24),i%4===0?gold:edgeMat);ring.rotation.x=Math.PI/2;ring.position.y=h*.7;ob.add(ring);ob.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(ob)}
const arenaRing=new THREE.Mesh(new THREE.TorusGeometry(21,.18,8,120),new THREE.MeshBasicMaterial({color:0x45eaff}));arenaRing.rotation.x=-Math.PI/2;arenaRing.position.y=.06;scene.add(arenaRing);
for(let i=0;i<8;i++){let a=i*Math.PI/4,r=15;let lamp=new THREE.PointLight(i%2?0x8c66ff:0x40eaff,24,13,2);lamp.position.set(Math.cos(a)*r,3,Math.sin(a)*r);scene.add(lamp)}
for(let i=0;i<40;i++){let a=i*2.399,r=3+Math.sqrt(i)*2.3;let tile=new THREE.Mesh(new THREE.RingGeometry(.18,.27,6),new THREE.MeshBasicMaterial({color:i%3?0x4f9aca:0xffb56a,transparent:true,opacity:.4,side:THREE.DoubleSide}));tile.rotation.x=-Math.PI/2;tile.position.set(Math.cos(a)*r,.01,Math.sin(a)*r);scene.add(tile)}
function orb(color,r){return new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),mat(color,.5))}
const player=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.75,.95,6,12),mat(0x20dce8,.45));body.position.y=1.35;player.add(body);const face=new THREE.Mesh(new THREE.BoxGeometry(1.1,.42,.18),mat(0x081428));face.position.set(0,1.62,.74);player.add(face);for(let x of [-.2,.2]){let eye=new THREE.Mesh(new THREE.BoxGeometry(.14,.13,.08),mat(0xd7ffff,1.3));eye.position.set(x,1.64,.86);player.add(eye)}for(let x of [-.35,.35]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.3,.55,.38),mat(0x138baf,.2));leg.position.set(x,.44,0);player.add(leg)}const ring=new THREE.Mesh(new THREE.TorusGeometry(.8,.055,6,32),new THREE.MeshBasicMaterial({color:0x56f6ff,transparent:true,opacity:.6}));ring.rotation.x=-Math.PI/2;ring.position.y=.05;player.add(ring);scene.add(player);
const enemyMats=[mat(0xff427e,.6),mat(0xffb05d,.5),mat(0xa97dff,.55)];let enemies=[],pickups=[],sparks=[],score=0,lives=3,elapsed=0,spawn=0,drop=0,inv=0,power=0,active=false,paused=false,drag=null,axis={x:0,y:0},last=performance.now(),best=0;try{best=+(localStorage.getItem('neon3dBest')||0)}catch(e){}
function makeEnemy(){let type=Math.floor(Math.random()*3),a=Math.random()*Math.PI*2,r=19+Math.random()*5,g=new THREE.Group(),core=new THREE.Mesh(type===0?new THREE.OctahedronGeometry(1.05):type===1?new THREE.DodecahedronGeometry(1.12):new THREE.IcosahedronGeometry(1.15),enemyMats[type]);core.position.y=1.1;g.add(core);let eye=orb(0xffffff,.16);eye.position.set(0,1.03,.8);g.add(eye);g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(g);enemies.push({g,type,speed:2.5+type*.5,phase:Math.random()*6})}
function pickup(){let power=Math.random()<.24,g=new THREE.Group(),m=orb(power?0x8dff6e:0xffdc74,.47);m.position.y=.85;g.add(m);g.position.set((Math.random()-.5)*25,0,(Math.random()-.5)*25);scene.add(g);pickups.push({g,power,phase:Math.random()*6})}
function burst(x,z,color){for(let i=0;i<13;i++){let mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.09),new THREE.MeshBasicMaterial({color,transparent:true}));mesh.position.set(x,.8,z);scene.add(mesh);sparks.push({mesh,vx:(Math.random()-.5)*8,vz:(Math.random()-.5)*8,vy:Math.random()*5,life:.45})}}
function reset(){enemies.forEach(e=>scene.remove(e.g));pickups.forEach(p=>scene.remove(p.g));sparks.forEach(s=>scene.remove(s.mesh));enemies=[];pickups=[];sparks=[];player.position.set(0,0,0);elapsed=score=spawn=drop=power=0;lives=3;inv=3;active=true;paused=false;axis={x:0,y:0};$('overlay').style.display='none';$('hud').style.display='flex';$('pause').textContent='Ⅱ';$('joy').style.display='none'}
function end(win){active=false;drag=null;axis={x:0,y:0};$('joy').style.display='none';if(score>best){best=score;try{localStorage.setItem('neon3dBest',best)}catch(e){}}$('overlay').style.display='grid';$('hud').style.display='none';$('description').textContent=(win?'KAZANDIN!':'OYUN BİTTİ')+' · Puan: '+score+' · Rekor: '+best;$('play').textContent='TEKRAR OYNA'}
$('play').onclick=reset;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};
const canvas=renderer.domElement,joy=$('joy'),nub=$('nub');canvas.addEventListener('pointerdown',e=>{if(!active||paused||drag)return;canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY};joy.style.left=e.clientX+'px';joy.style.top=e.clientY+'px';joy.style.display='block';axis={x:0,y:0}});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y,d=Math.hypot(dx,dy),v=Math.min(1,Math.max(0,(d-9)/48)),nx=d?dx/d:0,ny=d?dy/d:0;axis={x:nx*v,y:ny*v};let k=Math.min(d,42);nub.style.transform='translate(calc(-50% + '+nx*k+'px),calc(-50% + '+ny*k+'px))'});function release(e){if(drag&&e.pointerId===drag.id){drag=null;axis={x:0,y:0};joy.style.display='none';nub.style.transform='translate(-50%,-50%)'}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000,.04);last=now;if(active&&!paused){elapsed+=dt;inv=Math.max(0,inv-dt);power=Math.max(0,power-dt);let x=axis.x+(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),z=axis.y+(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0),d=Math.hypot(x,z);if(d>1){x/=d;z/=d}player.position.x=THREE.MathUtils.clamp(player.position.x+x*9*dt,-20,20);player.position.z=THREE.MathUtils.clamp(player.position.z+z*9*dt,-20,20);if(d>.15)player.rotation.y=Math.atan2(x,z);player.children[0].position.y=1.35+Math.sin(elapsed*13)*(d>.1?.09:.025);player.visible=inv<=0||Math.floor(elapsed*10)%2===0;ring.material.color.set(power>0?0xa6ff6d:0x56f6ff);spawn+=dt;drop+=dt;if(spawn>Math.max(.85,2.2-elapsed*.009)&&enemies.length<22){spawn=0;makeEnemy()}if(drop>3.3){drop=0;pickup()}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],v=new THREE.Vector3().subVectors(player.position,e.g.position);v.y=0;let dist=v.length();if(dist>.01){v.normalize();e.g.position.addScaledVector(v,e.speed*dt)}e.g.rotation.y+=dt*2;e.g.children[0].position.y=1.1+Math.sin(elapsed*5+e.phase)*.12;if(dist<1.45){if(power>0){burst(e.g.position.x,e.g.position.z,0xbaff68);scene.remove(e.g);enemies.splice(i,1);score+=15}else if(inv<=0){lives--;inv=2;burst(player.position.x,player.position.z,0xff547f);if(lives<=0){end(false);break}}}}for(let i=pickups.length-1;i>=0;i--){let p=pickups[i];p.g.rotation.y+=dt*2;p.g.children[0].position.y=.85+Math.sin(elapsed*4+p.phase)*.16;if(p.g.position.distanceTo(player.position)<1.35){if(p.power){power=7;score+=5}else score+=12;burst(p.g.position.x,p.g.position.z,p.power?0x8dff6e:0xffdc74);scene.remove(p.g);pickups.splice(i,1)}}if(elapsed>=90)end(true);$('hp').textContent='♥ '.repeat(lives);$('stats').textContent='◆ '+score+' · '+Math.floor(elapsed)+'s'+(power>0?' · ⚡'+Math.ceil(power):'')}
for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.life-=dt;s.mesh.position.x+=s.vx*dt;s.mesh.position.z+=s.vz*dt;s.mesh.position.y+=s.vy*dt;s.vy-=12*dt;s.mesh.material.opacity=Math.max(0,s.life/.45);if(s.life<=0){scene.remove(s.mesh);sparks.splice(i,1)}}let target=new THREE.Vector3(player.position.x,0,player.position.z);camera.position.lerp(new THREE.Vector3(target.x,innerHeight>innerWidth?19:16,target.z+(innerHeight>innerWidth?15:17)),.09);camera.lookAt(target.x,1,target.z);renderer.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
