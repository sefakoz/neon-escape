 style="display:none"><span id="hp">♥ ♥ ♥</span><span id="stats">◆ 0 · 0s</span><button id="pause">Ⅱ</button></div><div id="banner"></div><div id="overlay"><div id="panel"><small>NEW PLAYABLE WEB PROTOTYPE · V2</small><h1>NEON<br>ESCAPE ∞</h1><p id="desc">Kristalleri topla, düşmanlardan kaç. Yeşil yıldızı alırsan 7 saniye boyunca dokunduğun düşmanları patlat!</p><button id="go">OYNA</button><br><button id="mute">🔊 SES AÇIK</button><p><small>Parmağını ekranda sürükleyerek karakteri yönlendir.<br>90 saniye hayatta kal.</small></p></div></div></div><script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,D=1,playing=false,paused=false,mode='menu',last=0,time=0,score=0,best=+(localStorage.getItem('neonV2Best')||0),lives=3,inv=0,power=0,spawn=0,drop=0,particles=[],enemies=[],items=[],pointer=null,drag=false,shake=0,flash=0,combo=0,comboT=0,notice=0,muted=false,ac=null,stars=[];const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let hero={x:0,y:0,trail:[],face:0};let worldSeed=Array.from({length:38},(_,i)=>({u:(i*0.61803398875)%1,v:(i*.41421356237)%1,kind:i%5}));function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*D);c.height=Math.floor(H*D);g.setTransform(D,0,0,D,0,0);stars=Array.from({length:85},()=>({x:Math.random()*W,y:Math.random()*H,z:rnd(.3,1.8)}));if(!hero.x){hero.x=W/2;hero.y=H*.75}}addEventListener('resize',resize);resize();
