<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070d24"><title>NEON ESCAPE ∞</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060c1f;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:14px;font-weight:800;text-shadow:0 2px 10px #000}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#070e2df0,#190f38ec);text-align:center;padding:20px}#panel{width:min(440px,100%);padding:32px 22px;border:1px solid #5bc9ff80;border-radius:25px;background:#101c39dd;box-shadow:0 0 65px #17c9ff25}h1{font-size:clamp(40px,11vw,65px);line-height:.94;letter-spacing:-3px;margin:15px 0 22px;color:#61ebff;text-shadow:0 0 28px #2beaff88}p{color:#bbd2e9;line-height:1.6}button{border:0;border-radius:14px;padding:16px 25px;margin-top:20px;background:linear-gradient(90deg,#61f4ff,#6c96ff);color:#07112a;font-size:17px;font-weight:900;cursor:pointer}small{display:block;margin-top:18px;color:#9ab4d1}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="life">♥ ♥ ♥</span><span id="score">SKOR 0</span><span id="level">SEVİYE 1</span></div><div id="menu"><div id="panel"><small>THE INFINITE SURVIVAL</small><h1>NEON<br>ESCAPE ∞</h1><p id="message">Düşmanlardan kaç, kristalleri topla ve her 100 puanda enerji patlaması yarat. Parmağınla karakteri sürükle.</p><button id="start">MACERAYA BAŞLA</button><small>Mobil oynanabilir ilk GitHub sürümü</small></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let w,h,dpr,p,enemies=[],gems=[],particles=[],score=0,lives=3,level=1,running=false,last=0,spawn=0,gemTimer=0,elapsed=0,nextBlast=100,target=null;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(p){p.x=Math.min(w-20,p.x);p.y=Math.min(h-20,p.y)}}addEventListener('resize',resize);resize();function reset(){p={x:w/2,y:h/2,r:15,inv:0};enemies=[];gems=[];particles=[];score=0;lives=3;level=1;elapsed=0;spawn=0;gemTimer=0;nextBlast=100;running=true;target=null;document.getElementById('menu').style.display='none';updateHud()}function updateHud(){document.getElementById('life').textContent='♥ '.repeat(lives);document.getElementById('score').textContent='SKOR '+score;document.getElementById('level').textContent='SEVİYE '+level}document.getElementById('start').onclick=reset;function pointer(e){target={x:e.clientX,y:e.clientY}}c.addEventListener('pointerdown',pointer);c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});function burst(a,b,color,count=18){for(let i=0;i<count;i++){let t=rand(0,Math.PI*2),v=rand(30,170);particles.push({x:a,y:b,vx:Math.cos(t)*v,vy:Math.sin(t)*v,t:rand(.3,.8),color})}}function enemy(){let edge=Math.floor(rand(0,4)),a=edge===0?rand(0,w):edge===1?w+20:edge===2?rand(0,w):-20,b=edge===0?-20:edge===1?rand(0,h):edge===2?h+20:rand(0,h);enemies.push({x:a,y:b,r:rand(11,17),speed:rand(65,100)+level*9,angle:rand(0,7)})}function gem(){gems.push({x:rand(24,w-24),y:rand(65,h-30),r:10,t:0})}function end(){running=false;document.getElementById('message').textContent='Skor: '+score+' · Ulaşılan seviye: '+level+'. Yeniden dene ve rekorunu geliştir.';document.getElementById('start').textContent='TEKRAR OYNA';document.getElementById('menu').style.display='flex'}function tick(dt){elapsed+=dt;level=1+Math.floor(elapsed/22);spawn+=dt;gemTimer+=dt;if(spawn>Math.max(.23,1.05-level*.045)){spawn=0;enemy()}if(gemTimer>1.5){gemTimer=0;gem()}if(target){let dx=target.x-p.x,dy=target.y-p.y,dist=Math.hypot(dx,dy);if(dist>2){let s=Math.min(dist,420*dt);p.x+=dx/dist*s;p.y+=dy/dist*s}}p.x=Math.max(p.r,Math.min(w-p.r,p.x));p.y=Math.max(p.r,Math.min(h-p.r,p.y));p.inv=Math.max(0,p.inv-dt);for(const e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.angle+=dt*3;if(d<e.r+p.r&&p.inv===0){lives--;p.inv=1.7;burst(p.x,p.y,'#ff4fa6');updateHud();if(!lives){end();return}}}for(let i=gems.length-1;i>=0;i--){let g=gems[i];g.t+=dt;if(Math.hypot(g.x-p.x,g.y-p.y)<g.r+p.r){score+=10;burst(g.x,g.y,'#ffe783',9);gems.splice(i,1);updateHud()}}while(score>=nextBlast){nextBlast+=100;for(const e of enemies)burst(e.x,e.y,'#ff58a7',6);enemies=[];burst(p.x,p.y,'#6cfaff',70)}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;if(q.t<=0)particles.splice(i,1)}}function draw(t){let bg=x.createRadialGradient(w*.5,h*.48,20,w*.5,h*.5,Math.max(w,h)*.8);bg.addColorStop(0,'#18295b');bg.addColorStop(.6,'#0a1435');bg.addColorStop(1,'#04091a');x.fillStyle=bg;x.fillRect(0,0,w,h);for(let i=0;i<85;i++){let sx=((i*137.4)%w),sy=((i*251.7)%h);x.globalAlpha=.12+.3*(.5+.5*Math.sin(t*.0008+i));x.fillStyle='#c9e8ff';x.fillRect(sx,sy,1.5,1.5)}x.globalAlpha=1;for(const g of gems){x.save();x.translate(g.x,g.y);x.rotate(t*.0015);x.shadowColor='#ffdf71';x.shadowBlur=18;x.fillStyle='#ffe48d';x.beginPath();x.moveTo(0,-13);x.lineTo(9,0);x.lineTo(0,13);x.lineTo(-9,0);x.closePath();x.fill();x.restore()}for(const e of enemies){x.save();x.translate(e.x,e.y);x.rotate(e.angle);x.shadowColor='#ff3797';x.shadowBlur=17;x.fillStyle='#ff4f9d';x.beginPath();x.moveTo(0,-e.r);x.lineTo(e.r,0);x.lineTo(0,e.r);x.lineTo(-e.r,0);x.closePath();x.fill();x.fillStyle='#200b30';x.fillRect(-5,-3,3,4);x.fillRect(3,-3,3,4);x.restore()}if(p){x.save();x.translate(p.x,p.y);x.globalAlpha=p.inv>0?.45+.55*Math.sin(t*.025)**2:1;x.shadowColor='#41f5ff';x.shadowBlur=27;x.fillStyle='#42eaff';x.beginPath();x.arc(0,0,p.r,0,Math.PI*2);x.fill();x.fillStyle='#f3ffff';x.beginPath();x.arc(0,0,7,0,Math.PI*2);x.fill();x.restore()}for(const q of particles){x.globalAlpha=Math.min(1,q.t*2);x.fillStyle=q.color;x.fillRect(q.x,q.y,3,3)}x.globalAlpha=1}function frame(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(running)tick(dt);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
