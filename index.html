<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070d24"><title>NEON ESCAPE ∞ · MOBILE 2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;position:fixed;inset:0;overscroll-behavior:none;overflow:hidden;background:#060c1f;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:14px;font-weight:800;text-shadow:0 2px 10px #000}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#070e2df0,#190f38ec);text-align:center;padding:20px}#panel{width:min(440px,100%);padding:32px 22px;border:1px solid #5bc9ff80;border-radius:25px;background:#101c39dd;box-shadow:0 0 65px #17c9ff25}h1{font-size:clamp(40px,11vw,65px);line-height:.94;letter-spacing:-3px;margin:15px 0 22px;color:#61ebff;text-shadow:0 0 28px #2beaff88}p{color:#bbd2e9;line-height:1.6}button{border:0;border-radius:14px;padding:16px 25px;margin-top:20px;background:linear-gradient(90deg,#61f4ff,#6c96ff);color:#07112a;font-size:17px;font-weight:900;cursor:pointer}small{display:block;margin-top:18px;color:#9ab4d1}@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}@keyframes glow{0%,100%{filter:drop-shadow(0 0 12px #2cf3ff)}50%{filter:drop-shadow(0 0 36px #70faff)}}#panel{animation:enter .7s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(24px);background:linear-gradient(145deg,#122447ed,#241337ed);box-shadow:0 30px 90px #000b,0 0 85px #20eaff22}h1{animation:glow 3s ease-in-out infinite}button{box-shadow:0 10px 35px #3cf6ff44;transition:transform .15s}button:active{transform:scale(.95)}#hud{padding-top:max(14px,env(safe-area-inset-top))}#portalMsg{position:fixed;top:20%;width:100%;text-align:center;font-size:clamp(22px,6vw,40px);font-weight:1000;letter-spacing:2px;color:#bffaff;text-shadow:0 0 25px #27f4ff;pointer-events:none;opacity:0;transition:opacity .4s}#joy{position:fixed;bottom:max(38px,env(safe-area-inset-bottom));left:24px;width:132px;height:132px;border:2px solid #65edff80;border-radius:100%;background:radial-gradient(circle,#64eaff2c,#102c4e8a);box-shadow:inset 0 0 25px #64eaff18,0 0 28px #64eaff22;touch-action:none;pointer-events:auto;display:block;z-index:1000;user-select:none;-webkit-user-select:none}#knob{position:absolute;width:54px;height:54px;left:37px;top:37px;border-radius:100%;background:#65edff99;box-shadow:0 0 24px #65edff77}#hand{position:fixed;right:14px;bottom:max(22px,env(safe-area-inset-bottom));z-index:1100;border:1px solid #76eaff66;border-radius:30px;background:#0c2249cc;color:#d7faff;padding:11px 15px;font-size:12px;font-weight:800;touch-action:manipulation;backdrop-filter:blur(12px)}body.right-handed #joy{left:auto;right:24px}body.right-handed #hand{right:auto;left:14px}#menu{z-index:1200}#menu #hand{position:relative}#joy{bottom:max(78px,calc(env(safe-area-inset-bottom) + 58px));display:none}body.playing #joy{display:block}body:not(.playing) #hand{display:none}#hand:active{transform:scale(.95)}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="life">♥ ♥ ♥</span><span id="score">SKOR 0</span><span id="level">SEVİYE 1</span></div><div id="portalMsg"></div><div id="joy"><div id="knob"></div></div><button id="hand" type="button">JOYSTICK: SOL ⇄</button><div id="menu"><div id="panel"><small>THE INFINITE SURVIVAL</small><h1>NEON<br>ESCAPE ∞</h1><p id="message">Kristalleri topla, avcılardan kaç ve gizemli portallardan geç. Başlamadan önce kontrol elini seç. Oyun sırasında da değiştirebilirsin.</p><button id="start">MACERAYA BAŞLA</button><button id="menuHand" type="button" style="display:block;margin:12px auto 0;background:#172f56;color:#a8eeff;border:1px solid #6deaff77;font-size:14px;padding:12px 20px">KONTROL: SOL EL ⇄</button><small>SAĞLAK / SOLAK KONTROL • PORTALLAR</small></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),menu=document.getElementById('menu'),msg=document.getElementById('portalMsg'),joy=document.getElementById('joy'),knob=document.getElementById('knob');let w,h,dpr,p,enemies=[],gems=[],particles=[],seals=[],walls=[],score=0,lives=3,level=1,running=false,last=0,spawn=0,gemTimer=0,elapsed=0,nextBlast=100,room=0,roomTime=0,roomNum=0,move={x:0,y:0},down=null,keys={},shake=0,flash=0,portal=null;const hand=document.getElementById('hand');let handSide='left';function setHand(side){handSide=side;document.body.classList.toggle('right-handed',side==='right');hand.textContent='JOYSTICK: '+(side==='right'?'SAĞ':'SOL')+' ⇄';document.getElementById('menuHand').textContent='KONTROL: '+(side==='right'?'SAĞ':'SOL')+' EL ⇄';release()}hand.addEventListener('click',()=>setHand(handSide==='left'?'right':'left'));document.getElementById('menuHand').addEventListener('click',()=>setHand(handSide==='left'?'right':'left'));document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(p){p.x=clamp(p.x,20,w-20);p.y=clamp(p.y,70,h-20)}}addEventListener('resize',resize);resize();function say(t){msg.textContent=t;msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,1700)}function burst(a,b,color,n=18){for(let i=0;i<n;i++){let t=rand(0,7),v=rand(35,210);particles.push({x:a,y:b,vx:Math.cos(t)*v,vy:Math.sin(t)*v,t:rand(.3,.9),color})}}function hud(){document.getElementById('life').textContent='♥ '.repeat(lives);document.getElementById('score').textContent='✦ '+score;document.getElementById('level').textContent=room?'ODA '+roomNum:'SEVİYE '+level}function reset(){p={x:w/2,y:h*.6,r:15,inv:0};enemies=[];gems=[];particles=[];score=0;lives=3;level=1;elapsed=0;spawn=0;gemTimer=0;nextBlast=100;room=0;roomNum=0;roomTime=0;portal=null;running=true;menu.style.display='none';document.body.classList.add('playing');joy.style.display='block';say('KAÇIŞ BAŞLIYOR');hud()}document.getElementById('start').onclick=reset;function stick(e){if(down===null)return;let dx=e.clientX-down.x,dy=e.clientY-down.y,d=Math.hypot(dx,dy)||1,m=Math.min(1,d/48);move.x=dx/d*m;move.y=dy/d*m;knob.style.transform='translate('+move.x*36+'px,'+move.y*36+'px)'}joy.addEventListener('pointerdown',e=>{e.preventDefault();const r=joy.getBoundingClientRect();down={x:r.left+r.width/2,y:r.top+r.height/2};joy.setPointerCapture(e.pointerId);stick(e)});joy.addEventListener('pointermove',e=>{if(down!==null){e.preventDefault();stick(e)}});function release(){down=null;move={x:0,y:0};knob.style.transform='none'}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function enemy(){let edge=Math.floor(rand(0,4)),a=edge===0?rand(0,w):edge===1?w+20:edge===2?rand(0,w):-20,b=edge===0?-20:edge===1?rand(0,h):edge===2?h+20:rand(0,h);enemies.push({x:a,y:b,r:rand(10,16),speed:rand(48,83)+level*7,angle:rand(0,7)})}function gem(){gems.push({x:rand(24,w-24),y:rand(90,h-30),r:10,t:0})}function enterRoom(){room=1;roomNum++;roomTime=0;enemies=[];gems=[];walls=[];seals=[];p.x=w/2;p.y=h*.83;p.inv=2;let count=roomNum%3===0?3:2;for(let i=0;i<count;i++)seals.push({x:w*(i+1)/(count+1),y:h*(.24+(i%2)*.19),active:true});for(let i=0;i<3;i++)walls.push({x:rand(30,w-30),y:h*(.36+i*.12),r:rand(15,26),phase:rand(0,7)});say(['','ÇÖKEN TAPINAK','GÖLGE ODASI','ENERJİ GEÇİDİ'][(roomNum-1)%3+1]);hud()}function finishRoom(){room=0;elapsed=0;level++;score+=50;portal=null;burst(p.x,p.y,'#8efcff',65);say('ODA TAMAMLANDI +50');hud()}function hit(){if(p.inv>0)return;lives--;p.inv=1.6;shake=14;flash=.35;burst(p.x,p.y,'#ff4b9e',30);hud();if(!lives){running=false;document.body.classList.remove('playing');joy.style.display='none';document.getElementById('message').textContent='Skor '+score+' • '+roomNum+' keşfedilen oda. Yeniden dene, daha derine ilerle.';document.getElementById('start').textContent='YENİDEN KEŞFET';menu.style.display='flex'}}function tick(dt){elapsed+=dt;p.inv=Math.max(0,p.inv-dt);shake=Math.max(0,shake-60*dt);flash=Math.max(0,flash-dt);let mx=move.x+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),my=move.y+(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0),mag=Math.hypot(mx,my);if(mag>1){mx/=mag;my/=mag}p.x=clamp(p.x+mx*265*dt,20,w-20);p.y=clamp(p.y+my*265*dt,85,h-25);if(room){roomTime+=dt;for(let i=0;i<walls.length;i++){let z=walls[i];z.phase+=dt*(1.4+roomNum*.05);let xx=z.x+Math.sin(z.phase)*Math.min(w*.22,65);if(Math.hypot(p.x-xx,p.y-z.y)<p.r+z.r)hit()}for(let i=seals.length-1;i>=0;i--){let z=seals[i];if(Math.hypot(p.x-z.x,p.y-z.y)<31){burst(z.x,z.y,'#ffe38e',35);seals.splice(i,1);score+=20;say('MÜHÜR KIRILDI');hud()}}if(!seals.length){portal={x:w/2,y:Math.max(110,h*.15)};if(Math.hypot(p.x-portal.x,p.y-portal.y)<42)finishRoom()}if(roomTime>55){room=0;hit();say('KAPI KAPANDI')} }else{level=1+Math.floor(elapsed/22);spawn+=dt;gemTimer+=dt;if(spawn>Math.max(.3,1.1-level*.045)){spawn=0;enemy()}if(gemTimer>1.45){gemTimer=0;gem()}for(const e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.angle+=dt*3;if(d<e.r+p.r)hit()}for(let i=gems.length-1;i>=0;i--){let g=gems[i];g.t+=dt;if(Math.hypot(g.x-p.x,g.y-p.y)<g.r+p.r){score+=10;burst(g.x,g.y,'#ffe783',12);gems.splice(i,1);hud()}}if(elapsed>26)enterRoom();while(score>=nextBlast){nextBlast+=100;for(const e of enemies)burst(e.x,e.y,'#ff58a7',8);enemies=[];burst(p.x,p.y,'#6cfaff',70);say('ENERJİ PATLAMASI')}}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;if(q.t<=0)particles.splice(i,1)}}function draw(t){x.save();if(shake)x.translate(rand(-shake,shake),rand(-shake,shake));let bg=x.createRadialGradient(w*.5,h*.45,10,w*.5,h*.5,Math.max(w,h)*.8);bg.addColorStop(0,room?'#3b224e':'#1b2d5d');bg.addColorStop(.65,room?'#15102d':'#0a1435');bg.addColorStop(1,'#04091a');x.fillStyle=bg;x.fillRect(-20,-20,w+40,h+40);for(let i=0;i<85;i++){let sx=i*137.4%w,sy=i*251.7%h;x.globalAlpha=.12+.3*(.5+.5*Math.sin(t*.0008+i));x.fillStyle='#c9e8ff';x.fillRect(sx,sy,1.5,1.5)}x.globalAlpha=1;if(room){x.strokeStyle='#7c5dba33';x.lineWidth=2;for(let i=0;i<7;i++){x.beginPath();x.moveTo(i*w/6,70);x.lineTo(w/2,h);x.stroke()}for(const z of walls){let xx=z.x+Math.sin(z.phase)*Math.min(w*.22,65);x.save();x.translate(xx,z.y);x.rotate(z.phase);x.shadowColor='#ff539b';x.shadowBlur=22;x.fillStyle='#ff4d94';for(let i=0;i<8;i++){x.rotate(Math.PI/4);x.fillRect(-4,-z.r-10,8,20)}x.beginPath();x.arc(0,0,z.r*.6,0,7);x.fill();x.restore()}for(const z of seals){x.save();x.translate(z.x,z.y);x.rotate(t*.0007);x.shadowColor='#ffdf71';x.shadowBlur=25;x.strokeStyle='#ffe28a';x.lineWidth=5;x.strokeRect(-17,-17,34,34);x.restore()}if(portal){x.save();x.translate(portal.x,portal.y);x.shadowColor='#52efff';x.shadowBlur=45;x.strokeStyle='#67faff';x.lineWidth=7;x.beginPath();x.ellipse(0,0,29,40,0,0,7);x.stroke();x.restore()}x.fillStyle='#d9eaff';x.font='bold 14px system-ui';x.textAlign='center';x.fillText('MÜHÜRLERİ TOPLA • PORTALA ULAŞ',w/2,h-13)}else{for(const g of gems){x.save();x.translate(g.x,g.y);x.rotate(t*.0015);x.shadowColor='#ffdf71';x.shadowBlur=18;x.fillStyle='#ffe48d';x.beginPath();x.moveTo(0,-13);x.lineTo(9,0);x.lineTo(0,13);x.lineTo(-9,0);x.closePath();x.fill();x.restore()}for(const e of enemies){x.save();x.translate(e.x,e.y);x.rotate(e.angle);x.shadowColor='#ff3797';x.shadowBlur=17;x.fillStyle='#ff4f9d';x.beginPath();x.moveTo(0,-e.r);x.lineTo(e.r,0);x.lineTo(0,e.r);x.lineTo(-e.r,0);x.closePath();x.fill();x.restore()}}if(p){x.save();x.translate(p.x,p.y);x.globalAlpha=p.inv>0?.5+.5*Math.sin(t*.025)**2:1;x.shadowColor='#41f5ff';x.shadowBlur=30;x.fillStyle='#42eaff';x.beginPath();x.arc(0,0,p.r,0,7);x.fill();x.fillStyle='#f3ffff';x.beginPath();x.arc(0,0,7,0,7);x.fill();x.restore()}for(const q of particles){x.globalAlpha=Math.min(1,q.t*2);x.fillStyle=q.color;x.fillRect(q.x,q.y,3,3)}x.globalAlpha=1;if(flash){x.fillStyle='rgba(255,60,110,'+flash*.5+')';x.fillRect(0,0,w,h)}x.restore()}function frame(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(running)tick(dt);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
